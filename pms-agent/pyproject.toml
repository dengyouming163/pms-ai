[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pms-agent"
version = "0.1.0"
description = "pms-ai Agent 运行时：LangGraph 编排 + 回放/在线 LLM provider（M1 骨架）"
requires-python = ">=3.12"
# 依赖版本以 requirements.lock（pip freeze）为准；此处仅声明直接依赖，便于阅读与 `pip install -e .`
dependencies = [
  "fastapi",
  "uvicorn",
  "langgraph",
  "langchain-core",
  "langchain-openai",
  "psycopg[binary]",
  "pydantic",
  "pydantic-settings",
  "python-dotenv",
  "httpx",
  "langgraph-checkpoint-postgres",
]

[project.optional-dependencies]
# `pip install -e ".[test]"` 安装测试依赖
test = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
# 异步测试自动识别，无需逐函数标记 pytest.mark.asyncio
asyncio_mode = "auto"
# 显式设定异步 fixture 的事件循环作用域，消除 pytest-asyncio 弃用警告
asyncio_default_fixture_loop_scope = "function"
# 让 `app` 包在 pms-agent 根目录下可直接 import（测试从根目录运行）
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
  "error::pytest.PytestUnraisableExceptionWarning",
]
