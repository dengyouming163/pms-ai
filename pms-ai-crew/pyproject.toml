[project]
name = "pms-ai-crew"
version = "0.1.0"
description = "智宿管家 AI Agent 服务 — 基于 CrewAI 多智能体框架"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "crewai>=0.80.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "apscheduler>=3.10.0",
    "redis>=5.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[project.optional-dependencies]
# 开发/测试依赖（安装：pdm install -G dev 或 pip install -e ".[dev]"）
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
