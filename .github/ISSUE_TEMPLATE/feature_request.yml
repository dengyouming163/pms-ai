name: 功能建议
description: 提出新场景、新工具或体验改进
title: '[Feature] '
labels: ['enhancement', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        请先说明场景与约束，再讨论实现。越具体的边界，越容易评估。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前流程中的痛点，不要只给结论。
      placeholder: 例如：渠道体检目前只看价差，无法发现「同步延迟导致的超卖风险」。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你期望的行为、接口或界面。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的替代做法，以及为什么不选它们。
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 新增子图 / 工具
        - 审批与执行策略
        - 评测与基线
        - PC 后台
        - 移动端
        - 文档
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: 风险与边界
      description: 是否涉及写操作、租户边界、成本或延迟变化？
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过已有 Issue，确认不是重复建议
          required: true
